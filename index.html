      (function() {
        try {
          const theme = localStorage.getItem('portfolioTheme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);

            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
